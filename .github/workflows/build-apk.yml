name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest already has the Android SDK
      # preinstalled. setup-android@v3 tries to install the obsolete
      # 'tools' package and fails with sdkmanager exit code 1.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      # The source code is in the ZIP uploaded to the repo root.
      # Unzip it in place, dropping AI Studio-only folders.
      # Use cp -a unzipped/. . so hidden files like .env.example
      # are copied too - cp unzipped/* . skips dotfiles, and the
      # Secrets Gradle Plugin then fails with .env.example not found.
      - name: Unzip source
        run: |
          unzip -o chami---img-to-pdf.zip -x ".aistudio/*" "public/*" -d unzipped
          cp -a unzipped/. .
          rm -rf unzipped
          ls -la
          test -f app/build.gradle.kts
          test -f .env.example

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # SIGNED RELEASE - one-time keystore generation.
      # If ANDROID_KEYSTORE_BASE64 is set, reuse that keystore instead.
      # Otherwise generate a NEW keystore with alias "upload" from
      # FIX run #6: keytool defaults to PKCS12, which ignores a different
      # -keypass value, so Gradle could not read the key. -storetype JKS
      # supports different store and key passwords.
      # STORE_PASSWORD / KEY_PASSWORD. No secrets in if conditions -
      # GitHub rejects secrets there - all checks are in shell.
      # IMPORTANT: download the upload-keystore artifact after this
      # run and save my-upload-key.jks + both passwords safely.
      # Losing them means the app can never be updated.
      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Reused keystore from secret."
          elif [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storetype JKS -storepass "$STORE_PASSWORD" -alias upload -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Chami, O=Chami, C=IN"
            echo "Generated new upload keystore."
          else
            echo "No keystore secrets set, skipping release build."
          fi
          ls -la my-upload-key.jks || true

      # Upload the keystore BEFORE building release, so it is saved
      # even if the release build fails.
      - name: Upload upload keystore
        if: hashFiles('my-upload-key.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: my-upload-key.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f my-upload-key.jks ]; then
            echo "No upload keystore, skipping release build."
            exit 0
          fi
          gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pdf-maker-release-apk
          path: app/build/outputs/apk/release/app-release.apk

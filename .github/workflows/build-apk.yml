name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest already has the Android SDK
      # preinstalled. setup-android@v3 tries to install the obsolete
      # 'tools' package and fails with sdkmanager exit code 1.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      # The source code is in the ZIP uploaded to the repo root.
      # Unzip it in place, dropping AI Studio-only folders.
      # Use cp -a unzipped/. . so hidden files like .env.example
      # are copied too - cp unzipped/* . skips dotfiles, and the
      # Secrets Gradle Plugin then fails with .env.example not found.
      - name: Unzip source
        run: |
          unzip -o chami---img-to-pdf.zip -x ".aistudio/*" "public/*" -d unzipped
          cp -a unzipped/. .
          rm -rf unzipped
          ls -la
          test -f app/build.gradle.kts
          test -f .env.example

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

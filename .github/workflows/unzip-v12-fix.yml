name: Extract v1.2 fixed project (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Extract v1.2 fixed ZIP into the repo root
        run: |
          set -e
          ls -la
          mkdir -p /tmp/v12
          unzip -o chami-v12-merged.zip -d /tmp/v12
          cp -a /tmp/v12/chami-v12-merged/. .
          rm -f chami-v12-merged.zip chami-img-to-pdf.zip
          # Preserve the existing build workflow: the Actions token cannot
          # create or update workflow files, so restore build-apk.yml from
          # HEAD if the extracted project overwrote it, and drop any other
          # workflow files the ZIP may have brought in.
          git checkout HEAD -- .github/workflows/build-apk.yml
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            case "$f" in
              .github/workflows/build-apk.yml|.github/workflows/unzip-v12-fix.yml) ;;
              *) rm -f "$f" ;;
            esac
          done
          # This helper workflow file itself is left in place; delete it via
          # the web UI after the extraction commit.
          echo '--- repo root after extraction ---'
          ls -la
          echo '--- git status ---'
          git status --short
          echo '--- workflows after extraction ---'
          ls -la .github/workflows/

      - name: Commit extracted v1.2 fixed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Upload Chami PDF Maker v1.2 fixes (PdfEditorScreen compile fixes + real AdMob IDs)"
          git push
